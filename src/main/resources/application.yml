spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0's "iss" claim is "https://<tenant-domain>/", with the trailing slash.
          issuer-uri: "https://${AUTH0_DOMAIN}/"
          # Rejects tokens that were not issued for the Snippet Searcher API.
          audiences: "${AUTH0_AUDIENCE}"

management:
  endpoints:
    web:
      exposure:
        # Only health is public; it is what the Swarm healthcheck calls.
        include: health
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      # Every request gets a trace id, so logs can be correlated across services.
      probability: 1.0
